  <!-- Picks light or dark before the page is drawn (no white flash) -->
  <script>
    (function () {
      var theme = (window.SITE_SETTINGS && window.SITE_SETTINGS.theme) || {};
      var chosen = null;
      try { if (theme.showToggle !== false) chosen = localStorage.getItem('theme'); } catch (e) {}
      if (chosen !== 'light' && chosen !== 'dark') {
        chosen = theme.default === 'dark' ? 'dark'
          : theme.default === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark'
          : 'light';
      }
      document.documentElement.setAttribute('data-theme', chosen);
    })();
  </script>
