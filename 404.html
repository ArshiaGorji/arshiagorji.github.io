<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found</title>
  <!-- This page is shown for addresses that don't exist. It is self-contained on purpose. -->
  <style>
    :root { --bg: #f7f5f0; --text: #1f2937; --heading: #0f2440; --accent: #a8834b; --muted: #5f6673; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0a1322; --text: #cdd5e1; --heading: #eef1f7; --accent: #d2ae72; --muted: #97a1b3; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
    }
    .mark { width: 16px; height: 16px; margin: 0 auto 28px; border: 2px solid var(--accent); transform: rotate(45deg); }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: clamp(2.4rem, 8vw, 4rem); color: var(--heading); }
    p { margin: 12px 0 0; color: var(--muted); line-height: 1.7; }
    p[lang="fa"] { font-family: Tahoma, sans-serif; }
    a {
      display: inline-block; margin-top: 32px; padding: 12px 26px; border-radius: 999px;
      background: var(--heading); color: var(--bg); font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <p lang="fa" dir="rtl">این صفحه وجود ندارد.</p>
    <!-- If your site lives at https://name.github.io/repo-name/, change "/" to "/repo-name/" -->
    <a href="/">Back to home · صفحه اصلی</a>
  </main>
</body>
</html>
